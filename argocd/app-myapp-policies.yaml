apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KreusnaBayu/k8s-kind-lab.git
    targetRevision: master
    path: apps/myapp-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
